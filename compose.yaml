name: werms

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: werms
      POSTGRES_USER: werms
      POSTGRES_PASSWORD: werms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werms -d werms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["spatial"]
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://werms:werms@db:5432/werms
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: http://localhost:5173
      OPERATIONAL_DB_PATH: /app/data/operational/dehradun.sqlite3
      SPATIAL_DATABASE_URL: postgresql://werms:werms@db:5432/werms
    volumes:
      - pilot-data:/app/data/operational
      - ./artifacts/models:/app/artifacts/models:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pilot-data:
  postgres-data:
  redis-data:


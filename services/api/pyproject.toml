[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "werms-api"
version = "0.6.0"
description = "WERMS operational API and safe-routing domain"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ml = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "scipy==1.15.2",
  "joblib==1.4.2",
  "threadpoolctl==3.6.0",
  "pyarrow==19.0.1",
  "torch==2.6.0",
]
spatial = ["psycopg[binary]==3.2.6"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]
infrastructure = [
  "asyncpg>=0.30,<1",
  "geoalchemy2>=0.17,<1",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
werms_api = ["data/*.json", "data/research/firecastrl-v1/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

